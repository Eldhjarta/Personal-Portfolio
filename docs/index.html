<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Denis Meza | Technical Profile</title>
    <!-- Link to CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Main HUD Container -->
    <div class="hud-container">
        
        <!-- Top Header -->
        <header class="hud-header">
            <h1>TECHNICAL PERSONAL PROFILE</h1>
        </header>

        <!-- Profile Card -->
        <section class="profile-card">
            <div class="profile-pic">
                <!-- Put your real photo here later -->
                <img src="/static/foto.jpeg" alt="foto.jpeg">
            </div>
            <div class="profile-info">
                <h2 class="glow-text">Denis Meza</h2>
                <p>University Higher Technician in Systems Analysis and Design</p>
                <p class="status-text"></p>
            </div>
        </section>

        <!-- Action Buttons -->
        <nav class="hud-buttons">
            <div class="btn">👤 ABOUT ME</div>
            <div class="btn red-btn">⚙️ SKILLS & PROJECTS</div>
            <div class="btn">✉️ CONTACT</div>
            <div class="btn red-btn">📄 DOWNLOAD CV</div>
        </nav>

        <!-- Bottom Grid Sections -->
        <section class="bottom-grid">
            
            <!-- Key Skills -->
            <div class="panel">
                <h3>Key Skills</h3>
                <ul class="skills-list">
                    
                        <li><span class="icon">⚙️</span> Python Programming &amp; Development</li>
                    
                </ul>
            </div>

            <!-- Recent Experience -->
            <div class="panel">
                <h3>Recent Experience</h3>
                <ul class="exp-list">
                    
                        
                            <li>Coming Soon</li>
                        
                    
                </ul>
            </div>
            
        </section>

    </div>

</body>
</html>
